openapi: 3.0.3
info:
  title: Betledger Bankroll API
  version: 1.0.0
  description: Bankroll ledger operations for the static Betledger UI.
paths:
  /health:
    get:
      operationId: getBankrollHealth
      summary: Check service and database health
      responses:
        '200':
          description: The service can access its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database health probe failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /balance:
    get:
      operationId: getBalance
      summary: Read the current bankroll balance
      responses:
        '200':
          description: The sum of the signed ledger entries in cents.
          content:
            application/json:
              schema:
                type: object
                required: [balance_cents]
                properties:
                  balance_cents: {type: integer, format: int64}
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /deposits:
    post:
      operationId: createDeposit
      summary: Record a deposit in the ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, description]
              properties:
                amount_cents: {type: integer, minimum: 1, maximum: 2147483647}
                description: {type: string, minLength: 1, description: A nonblank deposit description.}
      responses:
        '201':
          description: The deposit was committed to the ledger.
          content:
            application/json:
              schema:
                type: object
                required: [id, amount_cents]
                properties:
                  id: {type: integer, minimum: 1}
                  amount_cents: {type: integer, minimum: 1, maximum: 2147483647}
        '400':
          description: The body was not a JSON object or the amount or description was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /kelly:
    post:
      operationId: suggestKellyStake
      summary: Calculate a stake suggestion without changing the ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decimal_odds, probability]
              properties:
                decimal_odds: {type: number, minimum: 1, exclusiveMinimum: true}
                probability: {type: number, minimum: 0, maximum: 1}
      responses:
        '200':
          description: Full Kelly and quarter-Kelly capped at EUR 10, in cents.
          content:
            application/json:
              schema:
                type: object
                required: [balance_cents, full_kelly_cents, suggested_stake_cents]
                properties:
                  balance_cents: {type: integer, format: int64}
                  full_kelly_cents: {type: integer, minimum: 0}
                  suggested_stake_cents: {type: integer, minimum: 0, maximum: 1000}
        '400':
          description: The JSON body, odds, or probability was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /bets:
    get:
      operationId: listRecordedBets
      summary: List recorded bets and settlement state
      responses:
        '200':
          description: List recorded bets and settlement state.
          content:
            application/json:
              schema:
                type: object
                required:
                - bets
                properties:
                  bets:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - decision_id
                      - stake_cents
                      - decimal_odds
                      - selection
                      - status
                      properties:
                        id:
                          type: integer
                          minimum: 1
                          maximum: 2147483647
                        decision_id:
                          type: integer
                          minimum: 1
                          maximum: 2147483647
                        stake_cents:
                          type: integer
                          minimum: 1
                          maximum: 1000
                        decimal_odds:
                          type: string
                          description: Decimal odds encoded as a string to preserve
                            precision.
                        selection:
                          type: string
                          enum:
                          - home
                          - draw
                          - away
                        status:
                          type: string
                          enum:
                          - open
                          - won
                          - lost
                          - void
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
    post:
      operationId: recordBet
      summary: Record a bet and debit its stake atomically
      responses:
        '201':
          description: Record a bet and debit its stake atomically.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
        '400':
          description: Invalid JSON input.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '409':
          description: The current state does not allow this operation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '200':
          description: The same decision and stake were already recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision_id
              - stake_cents
              properties:
                decision_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                stake_cents:
                  type: integer
                  minimum: 1
                  maximum: 1000
  /bets/{bet_id}/settlement:
    post:
      operationId: settleBet
      summary: Settle a recorded bet from the final score or void it
      responses:
        '200':
          description: Settle a recorded bet from the final score or void it.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - open
                    - won
                    - lost
                    - void
        '400':
          description: Invalid JSON input.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '409':
          description: The current state does not allow this operation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      parameters:
      - name: bet_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - void
              properties:
                void:
                  type: boolean
components:
  responses:
    DatabaseUnavailable:
      description: Bankroll could not complete the database operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, db, version]
      properties:
        status: {type: string, enum: [ok, error]}
        db: {type: string, enum: [ok, unavailable]}
        version: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
