openapi: 3.0.3
info:
  title: Betledger Journal API
  version: 1.0.0
  description: Imports and lists LaLiga fixtures and results for the static Betledger UI.
paths:
  /health:
    get:
      operationId: getJournalHealth
      summary: Check service and database health
      responses:
        '200':
          description: The service can access its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database health probe failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /matches:
    get:
      operationId: listImportedMatches
      summary: List imported fixtures with the available bankroll balance
      responses:
        '200':
          description: The imported fixtures remain available even if Bankroll cannot be reached.
          content:
            application/json:
              schema:
                type: object
                required: [matches, balance_cents, bankroll_status]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fixture'
                  balance_cents:
                    type: integer
                    format: int64
                    nullable: true
                    description: Null if Bankroll is unavailable.
                  bankroll_status: {type: string, enum: [ok, unavailable]}
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /matches/sync:
    post:
      operationId: syncLaLigaMatches
      summary: Import the LaLiga 2026–27 fixture feed
      description: Updates existing matches by their provider ID and inserts new matches. No request body is required.
      responses:
        '200':
          description: The source fixtures were processed.
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced: {type: integer, minimum: 0}
        '502':
          description: The upstream feed rejected the request, was unreachable, or returned invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The feed token is missing or Journal could not access its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /matches/{match_id}/betting:
    get:
      operationId: getFixtureBetting
      summary: Get saved odds, decisions and the Poisson estimate
      responses:
        '200':
          description: Get saved odds, decisions and the Poisson estimate.
          content:
            application/json:
              schema:
                type: object
                required:
                - odds
                - decisions
                - estimate
                - estimate_message
                properties:
                  odds:
                    type: array
                    items:
                      type: object
                      required:
                      - bookmaker
                      - home_odds
                      - draw_odds
                      - away_odds
                      properties:
                        bookmaker:
                          type: string
                          enum:
                          - bet365
                          - bwin
                        home_odds:
                          type: string
                          description: Decimal odds encoded as a string to preserve
                            precision.
                        draw_odds:
                          type: string
                          description: Decimal odds encoded as a string to preserve
                            precision.
                        away_odds:
                          type: string
                          description: Decimal odds encoded as a string to preserve
                            precision.
                  decisions:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - bookmaker
                      - selection
                      - decimal_odds
                      - model_probability
                      properties:
                        id:
                          type: integer
                          minimum: 1
                          maximum: 2147483647
                        bookmaker:
                          type: string
                          enum:
                          - bet365
                          - bwin
                        selection:
                          type: string
                          enum:
                          - home
                          - draw
                          - away
                        decimal_odds:
                          type: string
                          description: Decimal odds encoded as a string to preserve
                            precision.
                        model_probability:
                          type: number
                          minimum: 0
                          maximum: 1
                  estimate:
                    type: object
                    required:
                    - home_expected_goals
                    - away_expected_goals
                    - home_sample_size
                    - away_sample_size
                    - probabilities
                    properties:
                      home_expected_goals:
                        type: number
                      away_expected_goals:
                        type: number
                      home_sample_size:
                        type: integer
                      away_sample_size:
                        type: integer
                      probabilities:
                        type: object
                        required:
                        - home
                        - draw
                        - away
                        properties:
                          home:
                            type: number
                            minimum: 0
                            maximum: 1
                          draw:
                            type: number
                            minimum: 0
                            maximum: 1
                          away:
                            type: number
                            minimum: 0
                            maximum: 1
                    nullable: true
                  estimate_message:
                    type: string
                    nullable: true
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
  /matches/{match_id}/odds:
    post:
      operationId: saveFixtureOdds
      summary: Save manually entered decimal odds for a bookmaker
      responses:
        '200':
          description: Save manually entered decimal odds for a bookmaker.
          content:
            application/json:
              schema:
                type: object
                required:
                - bookmaker
                properties:
                  bookmaker:
                    type: string
                    enum:
                    - bet365
                    - bwin
        '400':
          description: Invalid JSON input.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bookmaker
              - home_odds
              - draw_odds
              - away_odds
              properties:
                bookmaker:
                  type: string
                  enum:
                  - bet365
                  - bwin
                home_odds:
                  type: number
                  minimum: 1.0001
                  maximum: 10000
                draw_odds:
                  type: number
                  minimum: 1.0001
                  maximum: 10000
                away_odds:
                  type: number
                  minimum: 1.0001
                  maximum: 10000
  /matches/{match_id}/decisions:
    post:
      operationId: saveBetDecision
      summary: Save an outcome using recorded odds and the Poisson probability
      responses:
        '201':
          description: Save an outcome using recorded odds and the Poisson probability.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
        '400':
          description: Invalid JSON input.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '409':
          description: The current state does not allow this operation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bookmaker
              - selection
              properties:
                bookmaker:
                  type: string
                  enum:
                  - bet365
                  - bwin
                selection:
                  type: string
                  enum:
                  - home
                  - draw
                  - away
  /decisions/{decision_id}:
    get:
      operationId: readBetDecision
      summary: Read saved odds, selection and the fixture result
      responses:
        '200':
          description: Read saved odds, selection and the fixture result.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - match_id
                - selection
                - decimal_odds
                - home_team
                - away_team
                - match_status
                - home_goals
                - away_goals
                properties:
                  id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  match_id:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  selection:
                    type: string
                    enum:
                    - home
                    - draw
                    - away
                  decimal_odds:
                    type: string
                    description: Decimal odds encoded as a string to preserve precision.
                  home_team:
                    type: string
                  away_team:
                    type: string
                  match_status:
                    type: string
                    enum:
                    - scheduled
                    - finished
                  home_goals:
                    type: integer
                    nullable: true
                  away_goals:
                    type: integer
                    nullable: true
        '404':
          description: Fixture or saved record was not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: A required service or database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
components:
  responses:
    DatabaseUnavailable:
      description: Journal could not complete the database operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, db, version]
      properties:
        status: {type: string, enum: [ok, error]}
        db: {type: string, enum: [ok, unavailable]}
        version: {type: string}
    Fixture:
      type: object
      required: [id, home_team, away_team, kickoff_at, home_goals, away_goals, status, source_status]
      properties:
        id: {type: integer, minimum: 1}
        home_team: {type: string, minLength: 1, maxLength: 120}
        away_team: {type: string, minLength: 1, maxLength: 120}
        kickoff_at: {type: string, format: date-time, nullable: true}
        home_goals: {type: integer, minimum: 0, nullable: true}
        away_goals: {type: integer, minimum: 0, nullable: true}
        status: {type: string, enum: [scheduled, finished]}
        source_status:
          type: string
          enum: [SCHEDULED, TIMED, IN_PLAY, PAUSED, EXTRA_TIME, PENALTY_SHOOTOUT, FINISHED, SUSPENDED, POSTPONED, CANCELLED, AWARDED]
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
