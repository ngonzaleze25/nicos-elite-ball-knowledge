services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}"
      BANKROLL_DB_PASSWORD: "${BANKROLL_DB_PASSWORD:?Set BANKROLL_DB_PASSWORD}"
      JOURNAL_DB_PASSWORD: "${JOURNAL_DB_PASSWORD:?Set JOURNAL_DB_PASSWORD}"
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -d master -i /init.sql'

  bankroll:
    build: ./services/bankroll
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "mssql://bankroll_app:${BANKROLL_DB_PASSWORD:?Set BANKROLL_DB_PASSWORD}@sqlserver:1433/bankroll"
    ports:
      - "127.0.0.1:8000:8000"
  journal:
    build: ./services/journal
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "mssql://journal_app:${JOURNAL_DB_PASSWORD:?Set JOURNAL_DB_PASSWORD}@sqlserver:1433/journal"
      BANKROLL_URL: "http://bankroll:8000"
      FOOTBALL_DATA_API_TOKEN: "${FOOTBALL_DATA_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8001:8000"

  ui:
    image: nginx:alpine
    depends_on:
      - bankroll
      - journal
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro

volumes:
  sqlserver-data:
